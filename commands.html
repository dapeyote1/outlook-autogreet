<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Auto Greet Commands</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script>
    Office.initialize = function () {};

    function extractFirstName(senderName, senderEmail) {
      if (senderName && senderName.trim().length > 0) {
        const parts = senderName.trim().split(/\s+/);
        const first = parts[0];
        return first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
      }
      if (senderEmail && senderEmail.includes("@")) {
        const localPart = senderEmail.split("@")[0];
        const namePart = localPart.split(/[._\-+]/)[0];
        return namePart.charAt(0).toUpperCase() + namePart.slice(1).toLowerCase();
      }
      return null;
    }

    function autoGreet(event) {
      const item = Office.context.mailbox.item;

      item.from.getAsync(function (result) {
        if (result.status === Office.AsyncResultStatus.Failed) {
          event.completed();
          return;
        }

        const sender = result.value;
        const senderName = sender ? sender.displayName : "";
        const senderEmail = sender ? sender.emailAddress : "";
        const firstName = extractFirstName(senderName, senderEmail);

        if (!firstName) {
          event.completed();
          return;
        }

        const greeting = "<p>Hi " + firstName + ",</p><p></p>";

        item.displayReplyFormAsync(
          { htmlBody: greeting },
          function (asyncResult) {
            event.completed();
          }
        );
      });
    }

    Office.actions.associate("autoGreet", autoGreet);
  </script>
</head>
<body></body>
</html>
